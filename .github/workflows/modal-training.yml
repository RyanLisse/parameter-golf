name: Modal Training Run

on:
  workflow_dispatch:
    inputs:
      experiment_id:
        description: 'Linear issue ID (e.g., RJC-29)'
        required: true
        type: string
      config:
        description: 'JSON config for training env vars'
        required: true
        type: string
      backend:
        description: 'Training backend (cuda/mlx)'
        default: 'cuda'
        type: string

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra cuda

      - name: Install Modal
        run: uv pip install modal

      - name: Authenticate Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: |
          modal token set --token-id "$MODAL_TOKEN_ID" --token-secret "$MODAL_TOKEN_SECRET"

      - name: Run training on Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
          EXPERIMENT_ID: ${{ inputs.experiment_id }}
          TRAINING_CONFIG: ${{ inputs.config }}
          BACKEND: ${{ inputs.backend }}
        run: uv run python scripts/modal_train.py

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: training-artifacts-${{ inputs.experiment_id }}-${{ github.run_id }}
          path: |
            logs/modal/*.log
            logs/modal/*.json
            records/
          retention-days: 30
